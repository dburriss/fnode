name: GitHub Release

on:
  push:
    tags:
      - 'v*'    # e.g., v0.1.0 or v0.1.0-alpha.1

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Stable releases have their own CHANGELOG section; prereleases leave the changelog
      # untouched, so their notes come from "Unreleased".
      - name: Extract release notes
        run: |
          for heading in "## [${{ steps.version.outputs.version }}]" "## [Unreleased]"; do
            awk -v h="$heading" '
              index($0, h) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if grep -q '[^[:space:]]' release-notes.md; then break; fi
          done
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No release notes found in CHANGELOG.md for ${{ steps.version.outputs.version }} or Unreleased"
            exit 1
          fi
          cat release-notes.md

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The tag is the version of record; Directory.Build.props must say the same, so a tag cannot ship a
      # different version than the one the release script committed.
      - name: Check tag matches Directory.Build.props
        if: github.ref_type == 'tag'
        run: |
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [ "$props" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match <Version>$props</Version> in Directory.Build.props"
            exit 1
          fi

      # All packages at the tag's version (see scripts/pack.sh for the list); fails if any is missing.
      - name: Pack
        run: scripts/pack.sh "${{ steps.version.outputs.version }}" ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease
